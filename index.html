<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHSAN THUMBNAIL DOWNLOADER</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            width: 100%;
        }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff0000;
            box-shadow: 0 0 30px rgba(255,0,0,0.5);
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 30px rgba(255,0,0,0.5); }
            50% { box-shadow: 0 0 60px rgba(255,0,0,0.8); }
        }

        h1 {
            font-size: 2em;
            font-weight: 800;
            background: linear-gradient(45deg, #ff0000, #ff4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #888;
            font-size: 0.9em;
        }

        /* INPUT CARD */
        .card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.3em;
        }

        .url-input {
            width: 100%;
            padding: 16px 20px 16px 45px;
            background: #0a0a0a;
            border: 2px solid #333;
            border-radius: 15px;
            color: white;
            font-size: 1em;
            outline: none;
            transition: all 0.3s;
        }

        .url-input:focus {
            border-color: #ff0000;
            box-shadow: 0 0 20px rgba(255,0,0,0.2);
        }

        .url-input::placeholder {
            color: #555;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .btn-fetch {
            background: linear-gradient(45deg, #ff0000, #cc0000);
            color: white;
            margin-bottom: 10px;
        }

        .btn-fetch:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,0,0,0.4);
        }

        .btn-fetch:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* RESULT */
        .result-area {
            display: none;
            margin-top: 20px;
            animation: fadeIn 0.5s ease;
        }

        .result-area.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .video-info {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255,0,0,0.05);
            border-radius: 15px;
            border: 1px solid rgba(255,0,0,0.2);
        }

        .video-title {
            font-weight: 700;
            font-size: 1.1em;
            color: #fff;
            margin-bottom: 5px;
        }

        .video-id {
            font-size: 0.8em;
            color: #ff4444;
            font-family: monospace;
        }

        .thumbnails-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .thumb-card {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .thumb-card:hover {
            border-color: #ff0000;
            box-shadow: 0 5px 20px rgba(255,0,0,0.2);
        }

        .thumb-preview {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        .thumb-info {
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .quality-label {
            font-weight: 700;
            font-size: 0.85em;
            color: #fff;
        }

        .resolution {
            font-size: 0.7em;
            color: #888;
        }

        .btn-download {
            padding: 8px 18px;
            background: #ff0000;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.3s;
            white-space: nowrap;
            text-decoration: none;
            display: inline-block;
        }

        .btn-download:hover {
            background: #cc0000;
            transform: scale(1.05);
        }

        .error-msg {
            color: #ff4444;
            text-align: center;
            margin-top: 15px;
            display: none;
            padding: 10px;
            background: rgba(255,0,0,0.1);
            border-radius: 10px;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            z-index: 9999;
            display: none;
            animation: slideIn 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .toast-success { background: #2ed573; }
        .toast-error { background: #ff4757; }
        .toast-info { background: #ffa502; }

        @media (max-width: 500px) {
            h1 { font-size: 1.5em; }
            .card { padding: 20px; }
            .thumbnails-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <img src="https://i.ibb.co/354b2DX2/logo.jpg" alt="Logo" class="logo-img" id="logoImg" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22><rect fill=%22%23ff0000%22 width=%2280%22 height=%2280%22 rx=%2240%22/><text x=%2240%22 y=%2255%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2240%22>🎬</text></svg>'">
            <h1>AHSAN THUMBNAIL DOWNLOADER</h1>
            <p class="subtitle">Download YouTube Thumbnails in All Qualities</p>
        </div>

        <!-- INPUT CARD -->
        <div class="card">
            <div class="input-group">
                <span class="input-icon">🔗</span>
                <input type="text" class="url-input" id="videoUrl" placeholder="Paste YouTube Video URL here..." autocomplete="off">
            </div>
            <button class="btn btn-fetch" id="fetchBtn" onclick="fetchThumbnails()">
                🎬 Get Thumbnails
            </button>
            <div class="error-msg" id="errorMsg"></div>
        </div>

        <!-- RESULT -->
        <div class="result-area" id="resultArea">
            <div class="video-info" id="videoInfo"></div>
            <div class="thumbnails-grid" id="thumbnailsGrid"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // QUALITY OPTIONS
        const qualities = [
            { label: 'HD (Max Resolution)', key: 'maxresdefault', size: '1280×720', icon: '🏆' },
            { label: 'High Quality', key: 'hqdefault', size: '480×360', icon: '⭐' },
            { label: 'Standard', key: 'sddefault', size: '640×480', icon: '📸' },
            { label: 'Medium', key: 'mqdefault', size: '320×180', icon: '🖼️' },
            { label: 'Default', key: 'default', size: '120×90', icon: '📷' }
        ];

        // EXTRACT VIDEO ID
        function extractVideoId(url) {
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/,
                /^([a-zA-Z0-9_-]{11})$/
            ];
            
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) return match[1];
            }
            return null;
        }

        // FETCH THUMBNAILS
        window.fetchThumbnails = async function() {
            const url = document.getElementById('videoUrl').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const resultArea = document.getElementById('resultArea');
            const btn = document.getElementById('fetchBtn');

            errorMsg.style.display = 'none';
            resultArea.classList.remove('show');

            if (!url) {
                errorMsg.textContent = '❌ Please enter a YouTube URL';
                errorMsg.style.display = 'block';
                return;
            }

            const videoId = extractVideoId(url);
            
            if (!videoId) {
                errorMsg.textContent = '❌ Invalid YouTube URL. Please check and try again.';
                errorMsg.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Loading...';

            // Small delay for UX
            await new Promise(r => setTimeout(r, 500));

            // Show video info
            document.getElementById('videoInfo').innerHTML = `
                <div class="video-title">🎬 Video Found!</div>
                <div class="video-id">ID: ${videoId}</div>
            `;

            // Generate thumbnails
            const grid = document.getElementById('thumbnailsGrid');
            grid.innerHTML = qualities.map(q => {
                const imgUrl = `https://img.youtube.com/vi/${videoId}/${q.key}.jpg`;
                return `
                    <div class="thumb-card">
                        <img src="${imgUrl}" 
                             class="thumb-preview" 
                             alt="${q.label}" 
                             loading="lazy"
                             onclick="window.open('${imgUrl}', '_blank')"
                             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22320%22 height=%22180%22><rect fill=%22%23111%22 width=%22320%22 height=%22180%22/><text x=%22160%22 y=%2295%22 text-anchor=%22middle%22 fill=%22%23888%22 font-size=%2220%22>Not Available</text></svg>'">
                        <div class="thumb-info">
                            <div>
                                <div class="quality-label">${q.icon} ${q.label}</div>
                                <div class="resolution">${q.size}</div>
                            </div>
                            <a href="${imgUrl}" 
                               class="btn-download" 
                               download="AHSAN_Thumbnail_${videoId}_${q.key}.jpg"
                               onclick="showToast('✅ Downloading ${q.label}...', 'success')">
                                📥 Download
                            </a>
                        </div>
                    </div>
                `;
            }).join('');

            resultArea.classList.add('show');
            resultArea.scrollIntoView({ behavior: 'smooth', block: 'center' });

            btn.disabled = false;
            btn.textContent = '🎬 Get Thumbnails';
            
            showToast('✅ Thumbnails loaded!', 'success');
        };

        // TOAST
        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast toast-${type}`;
            t.style.display = 'block';
            clearTimeout(t.hide);
            t.hide = setTimeout(() => t.style.display = 'none', 2500);
        }

        // Enter key
        document.getElementById('videoUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') fetchThumbnails();
        });

        console.log('🎬 AHSAN THUMBNAIL DOWNLOADER READY!');
    </script>
</body>
</html>
